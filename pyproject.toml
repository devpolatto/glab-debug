[project]
name = "glab-debug"
version = "0.1.0"
description = "Utilitário de diagnóstico do GitLab construído sobre a CLI glab"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Angelo Polatto", email = "angelo.polatto@govone.digital" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
glab-debug = "glab_debug.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glab_debug"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
